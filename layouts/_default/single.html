{{ define "main" }}
  <article class="reading shell">
    <header class="article-header">
      <p class="eyebrow">{{ with .Params.categories }}{{ index . 0 }}{{ else }}文章{{ end }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="article-summary">{{ . }}</p>{{ end }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    </header>
    <div class="article-content">{{ .Content }}</div>
    {{ with .Params.tags }}
      <footer class="tag-list">{{ range . }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}/"># {{ . }}</a>{{ end }}</footer>
    {{ end }}
  </article>
{{ end }}
