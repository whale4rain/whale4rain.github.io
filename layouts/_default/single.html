{{ define "main" }}
  <article class="reading shell">
    <a class="back-link" href="{{ "posts/" | relURL }}">← 返回文章</a>
    <header class="article-header">
      <p class="eyebrow">{{ with .Params.categories }}{{ index . 0 }}{{ else }}文章{{ end }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="article-summary">{{ . }}</p>{{ end }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    </header>
    <div class="article-content">{{ .Content }}</div>
    {{ with .GetTerms "tags" }}
      <footer class="tag-list">{{ range . }}<a href="{{ .RelPermalink }}"># {{ .LinkTitle }}</a>{{ end }}</footer>
    {{ end }}
  </article>
{{ end }}
