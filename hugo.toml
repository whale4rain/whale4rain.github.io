baseURL = "https://whale4rain.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "whale4rain"
theme = "PaperMod"
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "后端、分布式系统与编程语言的学习笔记。"
  author = "whale4rain"
  defaultTheme = "auto"
  disableThemeToggle = false
  DateFormat = "2006-01-02"

  ShowReadingTime = true
  ShowWordCount = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  ShowAllPagesInArchive = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "whale4rain"
    Content = "后端、分布式系统与编程语言的学习笔记。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/whale4rain"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.3
    minMatchCharLength = 1
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 3
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = false
    guessSyntax = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["$", "$"], ["\\(", "\\)"]]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
